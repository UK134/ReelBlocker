name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate app icon
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          ICON=ReelBlocker/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON"
          echo '{"info":{"author":"xcode","version":1}}' > ReelBlocker/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON/Contents.json"
          python3 scripts/make_icon.py "$ICON/icon.png"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project ReelBlocker.xcodeproj \
            -target ReelBlocker \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/ReelBlocker.app Payload/
          zip -qr ReelBlocker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ReelBlocker-ipa
          path: ReelBlocker.ipa

      - name: Publish to Releases (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ReelBlocker.ipa
          make_latest: true
